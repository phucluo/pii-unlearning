# SFT Exposed on the TOFU dataset.
# python train.py --config configs/tofu_sft.yaml [--key=value ...]

model_family: qwen2.5-1.5b
quantization: none
lora:
  r: 64
  alpha: 128
  dropout: 0.05

dataset: TOFU
data_path: data/tofu/full.json
question_key: question
answer_key: answer
max_length: 500

mode: sft
batch_size: 16
gradient_accumulation_steps: 2
num_epochs: 5
lr: 2.0e-5
weight_decay: 0.01
bf16: true
seed: 42

save_dir: outputs/sft_exposed/tofu/${model_family}
save_steps: 200
resume: true
