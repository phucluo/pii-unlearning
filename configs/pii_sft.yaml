# SFT Exposed step on the UnlearnPII dataset.
# python train.py --config configs/pii_sft.yaml

model_family: llama2-7b-base
quantization: none
lora:
  r: 64
  alpha: 128
  dropout: 0.05

dataset: PII
data_path: data/raw/full_with_qa.json
max_length: 500

mode: sft
batch_size: 4
gradient_accumulation_steps: 8
num_epochs: 5
lr: 2.0e-5
weight_decay: 0.01
bf16: true
seed: 42

save_dir: outputs/sft_exposed/llama2-7b-base
save_steps: 500
resume: true
