# Unlearning step (PII track).
# python train.py --config configs/pii_unlearn.yaml [--forget_loss=npo --split=forget10 ...]

model_family: llama2-7b-base
model_path: outputs/sft_exposed/llama2-7b-base
quantization: none
lora:
  r: 64
  alpha: 128
  dropout: 0.05

dataset: PII
forget_data_path: data/raw
retain_data_path: data/raw
split: forget10
idk_path: data/raw/idontknow.jsonl
max_length: 500

mode: unlearn
forget_loss: grad_ascent     # grad_ascent | grad_diff | npo | dpo | task_vector | aau_pii
retain_weight: 1.0
beta: 0.1

batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 8
lr: 1.0e-5
weight_decay: 0.01
max_steps: null
bf16: true
seed: 42

save_dir: outputs/unlearn/${forget_loss}/${split}/llama2-7b-base
