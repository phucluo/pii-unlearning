# Unlearning step (TOFU track).
# python train.py --config configs/tofu_unlearn.yaml [--forget_loss=npo --split=forget05 ...]

model_family: qwen2.5-1.5b
model_path: outputs/sft_exposed/tofu/qwen2.5-1.5b
quantization: none
lora:
  r: 8           # ignored when model_path is a PEFT checkpoint
  alpha: 16
  dropout: 0.05

dataset: TOFU
forget_data_path: data/tofu
retain_data_path: data/tofu
split: forget10
idk_path: data/tofu/idontknow.jsonl
question_key: question
answer_key: answer
max_length: 500

mode: unlearn
forget_loss: grad_ascent
retain_weight: 1.0
beta: 0.1

batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 8
lr: 1.0e-5
weight_decay: 0.01
max_steps: null
bf16: true
seed: 42

save_dir: outputs/unlearn/${forget_loss}/${split}/tofu/${model_family}
