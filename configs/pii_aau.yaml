# AAU-PII (Adaptive Adversarial Unlearning).
# python train.py --config configs/pii_aau.yaml [--aau.inner_method=npo ...]

model_family: llama2-7b-base
model_path: outputs/sft_exposed/llama2-7b-base
quantization: none
lora:
  r: 64
  alpha: 128
  dropout: 0.05

dataset: PII
forget_data_path: data/raw
retain_data_path: data/raw
split: forget10
idk_path: data/raw/idontknow.jsonl
max_length: 500
profiles_path: data/raw/full_user_profiles.json
names_path: data/raw/split_person_names

mode: aau_pii
forget_loss: aau_pii

batch_size: 4
gradient_accumulation_steps: 4
lr: 1.0e-5
weight_decay: 0.01
bf16: true
seed: 42

aau:
  rounds: 5
  inner_method: grad_ascent          # grad_ascent | npo
  inner_max_steps: 100
  retain_weight: 1.0
  beta: 0.1

  warm_start_path: null

  self_probe_samples: 1
  self_probe_temperature: 0.7
  max_new_tokens: 64
  gen_batch_size: 32

  top_k_hard_prompts: 50

  leak_threshold: 0.05
  utility_degradation: 1.5

save_dir: outputs/unlearn/aau_pii/${split}/llama2-7b-base
